<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句译 · 中译英写作练习</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ================= 设计令牌与全局 ================= */
:root{
  --bg:#f6f6f4;
  --surface:#ffffff;
  --surface-2:#fafaf8;
  --ink:#16161a;
  --ink-2:#3f3f46;
  --muted:#6f6f76;
  --faint:#a1a1aa;
  --line:#e9e9e6;
  --line-2:#d6d6d2;
  --err:#dc2626;
  --err-bg:rgba(220,38,38,.07);
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --serif-en:'Lora','Noto Sans SC',Georgia,serif;
  --mono:'IBM Plex Mono',Consolas,monospace;
  --shadow-md:0 6px 24px rgba(22,22,26,.07);
  --shadow-lg:0 24px 64px rgba(22,22,26,.16);
}
/* 触屏：禁用双击缩放但保留滚动与双击选词（WebKit 仅对命中元素自身生效，故用通配） */
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;}
html,body{height:100%;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  display:flex;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:rgba(0,0,0,0);
}
::selection{background:rgba(22,22,26,.12);}
button{font-family:inherit;cursor:pointer;}
/* hidden 属性优先于任何 display 声明，防止按钮类样式使其仍然占位 */
[hidden]{display:none !important;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#d9d9d6;border-radius:8px;border:2px solid var(--bg);}
::-webkit-scrollbar-track{background:transparent;}

/* ================= 左侧文章栏 ================= */
#rail{
  width:272px;flex:none;height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  border-right:1px solid var(--line);
  background:var(--surface);
  padding:28px 18px 16px;
  transition:transform .26s ease;
}
.brand{padding:0 8px 20px;}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.01em;}
.brand h1 em{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-left:6px;vertical-align:2px;}
.brand p{margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);}
#newArticleBtn{
  margin:0 0 14px;width:100%;padding:10px 12px;font-size:13.5px;font-weight:500;
  background:var(--ink);border:1px solid var(--ink);color:#fff;
  border-radius:10px;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;
}
#newArticleBtn:hover{background:#000;}
#articleList{flex:1;overflow-y:auto;padding:2px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.a-item{
  padding:10px 12px;border-radius:10px;cursor:pointer;position:relative;
  display:flex;align-items:center;gap:6px;transition:.14s;margin-bottom:2px;
}
.a-item:hover{background:var(--bg);}
.a-item.active{background:var(--bg);}
.a-main{flex:1;min-width:0;}
.a-title{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.a-meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px;}
.a-del{
  flex:none;border:none;background:none;color:var(--faint);opacity:0;
  padding:5px;border-radius:7px;transition:.14s;line-height:0;
}
.a-item:hover .a-del{opacity:.9;}
.a-del:hover{color:var(--err);background:var(--err-bg);}
.rail-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:8px;}
.rail-foot button{
  flex:1;padding:7px 0;font-size:12px;border-radius:8px;
  background:none;border:1px solid var(--line-2);color:var(--muted);transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.rail-foot button:hover{border-color:var(--ink);color:var(--ink);}

/* ================= 主区域 ================= */
#main{flex:1;overflow-y:auto;height:100vh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.wrap{max-width:800px;margin:0 auto;padding:0 44px 90px;}

/* ---- 原文录入 ---- */
#setupView{padding-top:8vh;}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint);}
#setupView h2{font-size:23px;margin:12px 0 8px;font-weight:700;}
.setup-tip{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.9;}
#sourceText{
  width:100%;min-height:280px;resize:vertical;outline:none;
  font-family:var(--sans);font-size:15.5px;line-height:2.1;color:var(--ink);
  padding:18px 20px;border:1px solid var(--line-2);border-radius:12px;
  background:var(--surface);transition:border-color .15s;
}
#sourceText:focus{border-color:var(--ink);}
.setup-actions{margin-top:18px;display:flex;align-items:center;gap:18px;}
#splitHint{font-size:13px;color:var(--muted);flex:1;}
#splitHint b{color:var(--ink);font-weight:700;padding:0 2px;}
/* 录入页底部服务来源声明 */
.attribution{margin-top:96px;font-size:11px;line-height:2;color:var(--faint);}
.attribution a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
.attribution a:hover{color:var(--ink-2);}

/* ---- 按钮体系 ---- */
.btn{
  padding:9px 18px;font-size:13.5px;font-weight:500;border-radius:10px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  transition:.15s;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{background:var(--bg);border-color:var(--faint);}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.primary:hover{background:#000;border-color:#000;}

/* ---- 练习视图 ---- */
#workHead{padding:38px 0 18px;border-bottom:1px solid var(--line);}
.head-row{display:flex;flex-direction:column;align-items:stretch;gap:14px;}
#titleBox{flex:1;min-width:140px;position:relative;}
#titleInput{
  width:100%;font-family:var(--sans);font-size:20px;font-weight:700;
  background:none;border:none;border-bottom:1px dashed transparent;color:transparent;
  outline:none;padding:3px 0;transition:.15s;
}
#titleInput:hover{border-bottom-color:var(--line-2);}
#titleInput:focus{border-bottom-color:var(--faint);color:var(--ink);}
/* 未聚焦时以省略号截断展示标题，聚焦后交还真实输入框 */
#titleShow{
  position:absolute;left:0;right:0;top:0;bottom:0;padding:3px 0;
  font-size:20px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;pointer-events:none;
}
#titleBox:focus-within #titleShow{display:none;}
#titleBox.editing #titleShow{display:none;}
#titleBox.editing #titleInput{color:var(--ink);}
.head-btns{display:flex;gap:8px;flex-wrap:wrap;}
.head-btns .btn{padding:8px 14px;font-size:12.5px;}
#metaInfo{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.03em;}

.sent{
  display:grid;grid-template-columns:40px 1fr;gap:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:22px 24px;margin-top:18px;
  transition:box-shadow .2s;
  animation:rise .45s ease both;animation-delay:calc(var(--i)*50ms);
}
.sent:hover{box-shadow:var(--shadow-md);}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.sent-no{font-family:var(--mono);font-size:12px;color:var(--faint);padding-top:5px;}
.zh{font-size:15.5px;line-height:1.95;margin-bottom:12px;cursor:text;}
.en{
  font-family:var(--serif-en);font-size:16.5px;line-height:1.75;color:var(--ink);
  min-height:52px;padding:10px 14px;border-radius:10px;cursor:text;word-break:break-word;
  background:var(--surface-2);border:1px solid var(--line);transition:.15s;
}
.en:hover{border-color:var(--line-2);}
.en:focus{outline:none;background:var(--surface);border-color:var(--ink);}
.en.empty::before{content:attr(data-ph);color:#b9b9bd;font-style:italic;pointer-events:none;}
.mark{
  color:var(--err);background:var(--err-bg);
  border-radius:3px;padding:0 2px;
}
/* 缺词缺词标记（校对符号，表示此处应有一个词） */
.gap{
  color:var(--err);font-weight:700;font-style:normal;
  background:var(--err-bg);border-radius:3px;padding:0 3px;margin:0 1px;
}
.tools{display:flex;align-items:center;gap:10px;margin-top:12px;opacity:0;transition:.18s;}
.sent:hover .tools,.sent:focus-within .tools{opacity:1;}
.tbtn-copy{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:500;padding:8px 16px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:.15s;
}
.tbtn-copy:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
.tbtn-copy svg{width:14px;height:14px;}
.tbtn{
  border:none;background:none;font-size:12px;color:var(--muted);
  padding:6px 8px;border-radius:8px;transition:.14s;
}
.tbtn:hover{color:var(--err);background:var(--err-bg);}
.practice-tip{margin-top:26px;font-size:12px;color:var(--faint);line-height:2;}
.practice-tip i{font-style:normal;color:var(--err);}

/* 视图入场动画（逐项上浮） */
.view-anim>*{animation:rise .45s ease both;}
.view-anim>*:nth-child(2){animation-delay:.05s;}
.view-anim>*:nth-child(3){animation-delay:.1s;}
.view-anim>*:nth-child(4){animation-delay:.15s;}
.view-anim>*:nth-child(5){animation-delay:.2s;}

/* 窄窗口：文章栏折叠为左侧抽屉 */
#menuBtn{
  display:none;position:fixed;left:14px;top:14px;z-index:68;
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);align-items:center;justify-content:center;
  box-shadow:var(--shadow-md);
}
#menuBtn:hover{border-color:var(--faint);}
#railScrim{display:none;position:fixed;inset:0;z-index:66;background:rgba(22,22,26,.32);}

/* ================= 查词浮标与词典面板 ================= */
#dictChip{
  position:fixed;z-index:55;display:none;align-items:center;gap:6px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:500;
  padding:7px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(22,22,26,.28);
  animation:pop .16s ease;user-select:none;cursor:pointer;
}
#dictChip:hover{background:#000;}
#dictChip:active{transform:scale(.97);}
#dictChip:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
#dictChip svg{width:12px;height:12px;}
#dictChip .chip-act{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:none;color:#fff;font:inherit;font-size:12px;font-weight:500;
  padding:0;cursor:pointer;white-space:nowrap;
}
#dictChip .chip-act + .chip-act{padding-left:10px;margin-left:10px;border-left:1px solid rgba(255,255,255,.3);}
/* 前一按钮隐藏时去掉分隔线与间距，避免残留空位 */
#dictChip .chip-act[hidden] + .chip-act{padding-left:0;margin-left:0;border-left:none;}
#dictChip .chip-act svg{width:12px;height:12px;}
/* 档位保存菜单（整篇保存 / 保存本句共用）与导入方式菜单 */
#saveMenu,#importMenu{
  position:fixed;z-index:60;display:none;flex-direction:column;min-width:138px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:6px;animation:pop .16s ease;
}
/* 导入菜单从侧栏唤起，需盖过抽屉层级 */
#importMenu{z-index:72;}
.save-opt{
  display:flex;align-items:center;gap:9px;border:none;background:none;
  font-family:inherit;font-size:13px;color:var(--ink);padding:8px 10px;border-radius:8px;
  transition:.14s;cursor:pointer;text-align:left;
}
.save-opt:hover{background:var(--bg);}
.save-badge{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-radius:6px;}
.save-badge.b-draft{border:1px solid var(--line-2);color:var(--muted);}
.save-badge.b-second{border:1px dashed var(--line-2);color:var(--muted);}
.save-badge.b-final{background:var(--ink);color:#fff;}
#dictPanel{
  position:fixed;z-index:56;width:min(360px,calc(100vw - 20px));display:none;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s ease;
}
.dict-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;}
.dict-wordbox{flex:1;min-width:0;}
#dictWord{font-family:var(--serif-en);font-size:19px;font-weight:600;word-break:break-all;}
#dictPhon{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6;}
.icon-close{border:none;background:none;color:var(--faint);padding:5px;border-radius:8px;line-height:0;transition:.14s;}
.icon-close:hover{color:var(--ink);background:var(--bg);}
#dictBody{padding:8px 18px 16px;max-height:300px;overflow-y:auto;font-size:13.5px;line-height:1.85;color:var(--ink-2);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.dict-loading{color:var(--faint);padding:6px 0;}
.dict-sec{margin-top:8px;}
.dict-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--faint);margin-bottom:3px;}
.dict-li{display:flex;gap:8px;padding:2px 0;}
.dict-pos{flex:none;font-family:var(--mono);font-size:11px;color:var(--faint);min-width:36px;padding-top:3px;}
.dict-src{margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--faint);}
.dict-src a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
.dict-src a:hover{color:var(--ink-2);}
/* 中文查询结果中的英文单词：点击转查 Free Dictionary API 英英释义 */
.dict-w{
  color:var(--ink);font-weight:500;cursor:pointer;
  border-bottom:1px dashed var(--line-2);transition:color .14s,border-color .14s;
}
.dict-w:hover{color:var(--err);border-bottom-color:var(--err);}

/* ================= 弹层通用 ================= */
.overlay{
  position:fixed;inset:0;z-index:76;display:none;align-items:center;justify-content:center;
  background:rgba(22,22,26,.42);backdrop-filter:blur(3px);padding:26px;
}
.overlay.show{display:flex;}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-lg);width:min(660px,100%);max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px);}to{opacity:1;transform:none;}}
.panel-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.panel-head h3{font-size:16px;font-weight:700;flex:1;}
.panel-body{padding:6px 22px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

/* 历史版本列表 */
.snap-item{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);}
.snap-item:last-child{border-bottom:none;}
.snap-badge{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border-radius:8px;}
.snap-badge.final{background:var(--ink);color:#fff;}
.snap-badge.draft{border:1px solid var(--line-2);color:var(--muted);}
.snap-badge.second{border:1px dashed var(--line-2);color:var(--muted);}
.snap-main{flex:1;min-width:0;}
.snap-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.snap-meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px;}
.snap-acts{display:flex;gap:4px;flex:none;}
.snap-acts .tbtn:hover{color:var(--ink);background:var(--bg);}
.snap-empty{padding:40px 0;text-align:center;color:var(--faint);font-size:13px;line-height:2.2;}

/* 版本只读查看 */
.ro-sent{padding:15px 0;border-bottom:1px solid var(--line);}
.ro-sent:last-child{border-bottom:none;}
.ro-zh{font-size:14.5px;line-height:1.9;margin-bottom:5px;}
.ro-en{font-family:var(--serif-en);font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word;}

/* 拼接全文查看 */
#concatOverlay .panel{width:min(720px,100%);}
#concatText{font-family:var(--serif-en);font-size:15.5px;line-height:2;white-space:pre-wrap;word-break:break-word;color:var(--ink);padding:4px 0;}
.concat-empty{color:var(--faint);font-style:italic;font-size:13px;}

/* 确认对话框 */
#confirmOverlay .panel{width:min(440px,100%);}
#confirmMsg{padding:24px 22px;font-size:14px;line-height:2;}
.confirm-acts{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px;}

/* 提示条 */
#toast{
  position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#f5f5f4;font-size:13px;
  padding:10px 20px;border-radius:999px;opacity:0;transition:.25s;z-index:80;
  pointer-events:none;box-shadow:0 10px 26px rgba(22,22,26,.3);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ================= 窄窗口：侧栏抽屉 ================= */
@media (max-width:880px){
  #menuBtn{display:flex;}
  #rail{
    position:fixed;left:0;top:0;bottom:0;z-index:70;
    transform:translateX(-102%);
    box-shadow:var(--shadow-lg);
  }
  #rail.open{transform:none;}
  .wrap{padding-left:68px;padding-right:24px;}
}

/* ================= 触屏优化（iPad / 平板） ================= */
/* 触摸屏设备（含外接键鼠的 iPad）：句内工具栏与文章删除键常显；录入框字号提到 16px 防 iOS 聚焦自动缩放 */
@media (hover:none), (any-pointer:coarse){
  .tools{opacity:1;}
  .a-del{opacity:.9;}
  #sourceText{font-size:16px;}
}
/* 存在粗指针输入：放大触控目标，配合 Apple Pencil / 手写输入 */
@media (any-pointer:coarse){
  .head-btns .btn{padding:10px 14px;}
  .tbtn{padding:10px;}
  .tbtn-copy{padding:11px 16px;}
  .save-opt{padding:11px 10px;}
  .icon-close{padding:9px;}
  .a-del{padding:10px;}
  #menuBtn{width:44px;height:44px;}
  .rail-foot button{padding:11px 0;}
}

/* ================= 触屏专用界面：撤回重做栏与句内固定按钮 ================= */
/* 触屏端不弹选中浮标（避让系统选中菜单），查词典/标红固定在句内工具栏 */
#undoBar{position:fixed;right:14px;top:14px;z-index:68;display:none;gap:8px;}
body.touch #undoBar.show{display:flex;}
#undoBar button{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-md);
}
#undoBar button:hover{border-color:var(--faint);}
#undoBar button:disabled{opacity:.35;}
/* 编辑器内恢复原生触摸手势：系统双击选词与触控笔划掉依赖完整手势识别 */
.en{touch-action:auto;}
/* 触屏专用按钮：PC 端隐藏；查词典/标红仅在句内选中文字时出现并加粗 */
.touchonly{display:none;}
body.touch .sent .tbtn[data-act="dictsel"],
body.touch .sent .tbtn[data-act="marksel"]{display:none;font-weight:700;}
body.touch .sent.sel-en .tbtn[data-act="dictsel"],
body.touch .sent.sel-en .tbtn[data-act="marksel"],
body.touch .sent.sel-zh .tbtn[data-act="dictsel"]{display:inline-block;}
</style>
</head>
<body>

<!-- 窄窗口菜单键与遮罩 -->
<button id="menuBtn" title="打开文章菜单" aria-label="打开文章菜单">

<script>
/* ============================================================
   句译 · 单句中译英写作练习
   ============================================================ */
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };

/* ---------------- 状态与持久化模块 ---------------- */
var LS_KEY = 'juyi_v1';
var state = null;
try { state = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){ state = null; }
if (!state || !Array.isArray(state.articles)) state = { articles: [], currentId: null };
if (state.articles.length === 0) {
  var a0 = createArticle();
  state.articles.push(a0);
  state.currentId = a0.id;
}
if (!cur()) state.currentId = state.articles[0].id;
state.articles.forEach(function(a){ if (typeof a.autoTitle !== 'boolean') a.autoTitle = (a.title === '未命名文章'); });

var saveTimer = null;
var storageWarned = false;
function persistNow(){
  clearTimeout(saveTimer);
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){
    if (!storageWarned){
      storageWarned = true;
      toast('浏览器存储不可用或已满，内容可能无法保存，请尽快导出备份', 4000);
    }
  }
}
function persist(){ clearTimeout(saveTimer); saveTimer = setTimeout(persistNow, 400); }
window.addEventListener('beforeunload', persistNow);
window.addEventListener('pagehide', persistNow);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') persistNow(); });

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function cur(){ for (var i=0;i<state.articles.length;i++) if (state.articles[i].id === state.currentId) return state.articles[i]; return null; }

/* ---------------- 档位模块（初稿 / 二稿 / 终稿，每档仅一份，逐句存稿拼接为整篇） ---------------- */
var SLOT_TYPES = ['draft', 'second', 'final'];
var SLOT_LABEL = { draft: '初稿', second: '二稿', final: '终稿' };
function emptySlots(){ return { draft: null, second: null, final: null }; }

/* 旧版快照（多份初稿/终稿）迁移：各档取最近一份，按中文句匹配逐句写入档位，其余丢弃 */
function applyLegacySnapshots(article, snaps){
  ['draft', 'final'].forEach(function(t){
    var latest = null;
    snaps.forEach(function(s){
      if (s && s.type === t && (!latest || (s.time || 0) > (latest.time || 0))) latest = s;
    });
    if (!latest || !Array.isArray(latest.sentences) || !Array.isArray(article.sentences)) return;
    var used = latest.sentences.map(function(){ return false; });
    article.sentences.forEach(function(curSent){
      for (var i = 0; i < latest.sentences.length; i++){
        var ls = latest.sentences[i];
        if (used[i] || !ls || ls.zh !== curSent.zh) continue;
        used[i] = true;
        if (typeof ls.en === 'string' && plainOf(ls.en)) curSent[t] = ls.en;
        break;
      }
    });
    var has = article.sentences.some(function(s){ return !!s[t]; });
    if (has) article.slots[t] = { time: typeof latest.time === 'number' ? latest.time : Date.now(), title: latest.title || article.title };
  });
}
/* 就地迁移一篇文章至档位模型 */
function migrateArticleInPlace(a){
  if (!a.slots || typeof a.slots !== 'object') a.slots = emptySlots();
  if (Array.isArray(a.snapshots) && a.snapshots.length) applyLegacySnapshots(a, a.snapshots);
  delete a.snapshots;
}

function createArticle(){
  return { id: uid(), title: '未命名文章', autoTitle: true, createdAt: Date.now(), sourceText: '', sentences: null, slots: emptySlots() };
}
function fmtTime(ts){
  var d = new Date(ts), p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function escapeHTML(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------------- 分句模块 ---------------- */
function splitSentences(raw){
  var out = [];
  var lines = String(raw || '').split(/\r?\n+/);
  for (var i=0;i<lines.length;i++){
    /* 在句末标点后插入分隔符再拆分，兼容不支持 lookbehind 的浏览器 */
    var marked = lines[i].replace(/([。！？!?；;]|……)/g, '$1\u0001');
    var parts = marked.split('\u0001');
    for (var j=0;j<parts.length;j++){
      var t = parts[j].trim();
      if (t) out.push(t);
    }
  }
  return out;
}

/* 自动标题：取首个单句并去除句末标点 */
function titleFromSource(text){
  var sents = splitSentences(text);
  if (!sents.length) return '未命名文章';
  var t = sents[0].replace(/[。！？!?；;…，、,\s]+$/, '').trim().slice(0, 40);
  return t || '未命名文章';
}

/* ---------------- 提示条 ---------------- */
var toastTimer = null;
function toast(msg, dur){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, dur || 1800);
}

/* ---------------- 确认对话框 ---------------- */
var confirmCb = null;
function confirmBox(msg, cb){
  $('#confirmMsg').textContent = msg;
  confirmCb = cb;
  $('#confirmOverlay').classList.add('show');
}
$('#confirmOk').addEventListener('click', function(){
  $('#confirmOverlay').classList.remove('show');
  if (confirmCb) { var cb = confirmCb; confirmCb = null; cb(); }
});
$('#confirmCancel').addEventListener('click', function(){
  $('#confirmOverlay').classList.remove('show');
  confirmCb = null;
});

/* ---------------- 编辑器序列化（仅保留文本、标红与缺词标记结构） ---------------- */
function serializeEditor(root){
  function walk(node){
    var s = '';
    for (var ch = node.firstChild; ch; ch = ch.nextSibling){
      if (ch.nodeType === 3) s += escapeHTML(ch.nodeValue);
      else if (ch.nodeType === 1 && ch.classList && ch.classList.contains('gap')){
        s += '<span class="gap">|</span>';
      } else if (ch.nodeType === 1 && ch.classList && ch.classList.contains('mark')){
        var inner = walk(ch);
        if (inner) s += '<span class="mark">' + inner + '</span>';
      } else {
        s += walk(ch);
      }
    }
    return s;
  }
  return walk(root);
}
function plainOf(html){
  var d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').trim();
}
/* 剔除缺词标记后的纯文本（标记以空格占位，用于拼接全文） */
function plainOfNoGap(html){
  var d = document.createElement('div');
  d.innerHTML = html;
  var gaps = d.querySelectorAll('.gap');
  for (var i = gaps.length - 1; i >= 0; i--){
    var g = gaps[i];
    g.parentNode.replaceChild(document.createTextNode(' '), g);
  }
  return (d.textContent || '').replace(/\s{2,}/g, ' ').trim();
}

/* ---------------- 窄窗口抽屉与标题展示 ---------------- */
var rail = $('#rail'), menuBtn = $('#menuBtn'), railScrim = $('#railScrim');
var titleBox = $('#titleBox'), titleInput = $('#titleInput'), titleShow = $('#titleShow');
function closeRail(){ rail.classList.remove('open'); railScrim.style.display = 'none'; }
menuBtn.addEventListener('click', function(){
  var open = rail.classList.toggle('open');
  railScrim.style.display = open ? 'block' : 'none';
});
railScrim.addEventListener('click', closeRail);
/* 点击抽屉与菜单键以外的任意区域时收起抽屉 */
document.addEventListener('mousedown', function(e){
  if (rail.classList.contains('open') && !rail.contains(e.target) && !menuBtn.contains(e.target)) closeRail();
});
/* 标题展示态（省略号）/ 编辑态切换 */
titleInput.addEventListener('focus', function(){ titleBox.classList.add('editing'); });
titleInput.addEventListener('blur', function(){ titleBox.classList.remove('editing'); syncTitleShow(); });
function syncTitleShow(){ titleShow.textContent = titleInput.value; }

/* ---------------- 文章栏渲染 ---------------- */
function renderRail(){
  var box = $('#articleList');
  box.innerHTML = '';
  state.articles.forEach(function(a){
    var item = document.createElement('div');
    item.className = 'a-item' + (a.id === state.currentId ? ' active' : '');
    var count = a.sentences ? a.sentences.length + ' 句' : '未开始';
    var meta = document.createElement('div');
    meta.className = 'a-main';
    meta.innerHTML = '<div class="a-title">' + escapeHTML(a.title) + '</div>' +
                     '<div class="a-meta">' + count + ' · ' + fmtTime(a.createdAt) + '</div>';
    var del = document.createElement('button');
    del.className = 'a-del';
    del.title = '删除文章';
    del.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0-1 13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 7"/></svg>';
    del.addEventListener('click', function(ev){
      ev.stopPropagation();
      closeRail();
      confirmBox('确定删除文章「' + a.title + '」？其全部初稿、二稿与终稿将一并删除。', function(){
        var idx = state.articles.indexOf(a);
        if (idx > -1) state.articles.splice(idx, 1);
        if (state.currentId === a.id){
          state.currentId = state.articles.length ? state.articles[0].id : null;
          if (!state.currentId){ var na = createArticle(); state.articles.push(na); state.currentId = na.id; }
        }
        editingSource = false;
        persistNow(); renderRail(); renderMain();
      });
    });
    item.appendChild(meta);
    item.appendChild(del);
    item.addEventListener('click', function(){
      closeRail();
      if (state.currentId !== a.id){
        persistNow();
        state.currentId = a.id;
        editingSource = false;
        persistNow(); renderRail(); renderMain();
      }
    });
    box.appendChild(item);
  });
}

/* ---------------- 主视图渲染 ---------------- */
var editingSource = false;
var editBackup = null; /* 进入编辑原文前的原文快照，供取消编辑还原 */
function renderMain(){
  var a = cur();
  if (!a) return;
  var setup = $('#setupView'), prac = $('#practiceView');
  if (!a.sentences || editingSource){
    setup.hidden = false; prac.hidden = true;
    $('#sourceText').value = a.sourceText || '';
    /* 已有练习内容时提供取消编辑入口 */
    $('#cancelEditBtn').hidden = !a.sentences;
    updateSplitHint();
    /* 重触发入场动画：切换文章/返回录入时同样播放 */
    setup.classList.remove('view-anim');
    void setup.offsetWidth;
    setup.classList.add('view-anim');
  } else {
    setup.hidden = true; setup.classList.remove('view-anim');
    prac.hidden = false;
    titleInput.value = a.title;
    syncTitleShow();
    titleBox.classList.toggle('editing', document.activeElement === titleInput);
    renderSentences(a);
    updateMeta();
  }
  /* 触屏端仅在练习视图显示固定撤回重做栏 */
  $('#undoBar').classList.toggle('show', IS_COARSE && !!a.sentences && !editingSource);
  refreshUndoBtns();
}

function updateSplitHint(){
  var t = $('#sourceText').value;
  var n = splitSentences(t).length;
  $('#splitHint').innerHTML = n > 0 ? '将拆分为 <b>' + n + '</b> 句' : '将按句末标点自动拆分';
}

function renderSentences(a){
  var list = $('#sentenceList');
  list.innerHTML = '';
  a.sentences.forEach(function(s, i){
    var card = document.createElement('article');
    card.className = 'sent';
    card.style.setProperty('--i', i);

    var no = document.createElement('div');
    no.className = 'sent-no';
    no.textContent = (i < 9 ? '0' : '') + (i + 1);

    var body = document.createElement('div');

    var zh = document.createElement('p');
    zh.className = 'zh';
    zh.textContent = s.zh;

    var en = document.createElement('div');
    en.className = 'en';
    en.setAttribute('contenteditable', 'true');
    en.setAttribute('spellcheck', 'false');
    en.setAttribute('autocorrect', 'off');
    en.setAttribute('autocapitalize', 'off');
    en.setAttribute('autocomplete', 'off');
    en.setAttribute('data-ph', 'Write your English sentence here…');
    if (s.en) en.innerHTML = sanitizeEnHTML(s.en);
    en.classList.toggle('empty', !plainOf(s.en || ''));

    bindEditor(en, a.id, i);

    var tools = document.createElement('div');
    tools.className = 'tools';
    tools.innerHTML =
      '<button class="tbtn-copy" data-act="copy">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制本句' +
      '</button>' +
      '<button class="tbtn" data-act="gap" title="在光标处插入缺词标记">缺词标记</button>' +
      '<button class="tbtn" data-act="save" title="将本句当前内容存入某一档">保存本句</button>' +
      '<button class="tbtn touchonly" data-act="dictsel" title="查询当前选中文字">查词典</button>' +
      '<button class="tbtn touchonly" data-act="marksel" title="标红或取消标红当前选中文字">标红</button>';
    function runTool(action, btn){
      if (action === 'copy') copyText(plainOf(en.innerHTML), '本句英文已复制');
      if (action === 'gap') insertGapMarker(en);
      if (action === 'save') openSaveMenu(btn, i);
      if (action === 'dictsel'){
        var sel = window.getSelection();
        var node = (sel && sel.rangeCount) ? sel.getRangeAt(0).commonAncestorContainer : null;
        if (node && node.nodeType === 3) node = node.parentNode;
        if (!sel || sel.isCollapsed || !node.closest || !card.contains(node)){ toast('请先选中本句中的文字'); return; }
        var text = sel.toString().trim();
        if (!text){ toast('请先选中本句中的文字'); return; }
        if (text.length > 60){ toast('选中内容过长，无法查询'); return; }
        openDict(text);
      }
      if (action === 'marksel'){
        var box = selectionIn(en);
        if (!box){ toast('请先在本句英文中选中文字'); return; }
        if (selectionIntersectsGap(en, box.range)){ toast('无法标红缺词标记'); return; }
        if (selectionAllMarked(en, box.range)) unmarkSelection(en);
        else markSelection(en);
      }
    }
    /* 触屏在 pointerdown 阶段读取选区并执行，避免点按按钮时系统先清空选区 */
    var toolFired = false;
    tools.addEventListener('pointerdown', function(e){
      if (e.pointerType === 'mouse'){ toolFired = false; return; }
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var action = btn.getAttribute('data-act');
      if (action !== 'dictsel' && action !== 'marksel') return;
      toolFired = true;
      runTool(action, btn);
    });
    tools.addEventListener('click', function(ev){
      var btn = ev.target.closest('[data-act]');
      if (!btn) return;
      var action = btn.getAttribute('data-act');
      if ((action === 'dictsel' || action === 'marksel') && toolFired){ toolFired = false; return; }
      runTool(action, btn);
    });

    body.appendChild(zh);
    body.appendChild(en);
    body.appendChild(tools);
    card.appendChild(no);
    card.appendChild(body);
    list.appendChild(card);
  });
}

function updateMeta(){
  var a = cur();
  if (!a || !a.sentences) return;
  var written = 0;
  a.sentences.forEach(function(s){ if (plainOf(s.en || '')) written++; });
  var meta = a.sentences.length + ' 句 · 已写 ' + written + ' 句';
  SLOT_TYPES.forEach(function(t){
    var n = 0;
    a.sentences.forEach(function(s){ if (s[t]) n++; });
    meta += ' · ' + SLOT_LABEL[t] + ' ' + n + '/' + a.sentences.length;
  });
  $('#metaInfo').textContent = meta;
}

/* ---------------- 编辑器事件绑定 ---------------- */
/* 编辑器内按文本序号存取光标位置（配合 normalize 保持光标不漂移） */
function editorCaretOffset(ed){
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return -1;
  var range = sel.getRangeAt(0);
  if (!ed.contains(range.startContainer)) return -1;
  var off = 0;
  var walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, null);
  while (walker.nextNode()){
    var n = walker.currentNode;
    if (n === range.startContainer) return off + range.startOffset;
    off += n.nodeValue.length;
  }
  return -1;
}
function setEditorCaretOffset(ed, target){
  var walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, null);
  var off = 0, last = null, lastLen = 0;
  while (walker.nextNode()){
    var n = walker.currentNode, len = n.nodeValue.length;
    if (off + len >= target){
      var r = document.createRange();
      r.setStart(n, Math.min(Math.max(target - off, 0), len));
      r.collapse(true);
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      return;
    }
    off += len; last = n; lastLen = len;
  }
  if (last){
    var r2 = document.createRange();
    r2.setStart(last, lastLen);
    r2.collapse(true);
    var sel2 = window.getSelection();
    sel2.removeAllRanges(); sel2.addRange(r2);
  }
}
function onEditorInput(editor){
  var aid = editor.getAttribute('data-aid');
  var idx = parseInt(editor.getAttribute('data-idx'), 10);
  var a = null;
  for (var i=0;i<state.articles.length;i++) if (state.articles[i].id === aid) { a = state.articles[i]; break; }
  if (!a || !a.sentences || !a.sentences[idx]) return;
  a.sentences[idx].en = serializeEditor(editor);
  editor.classList.toggle('empty', !plainOf(editor.innerHTML));
  persist();
  if (a.id === state.currentId) updateMeta();
  /* 触控笔/输入易碎片化文本节点，延时合并并复位光标，缓解划掉手势定位左偏 */
  clearTimeout(editor._normT);
  editor._normT = setTimeout(function(){
    if (!document.contains(editor)) return;
    var off = editorCaretOffset(editor);
    editor.normalize();
    if (off >= 0 && document.activeElement === editor) setEditorCaretOffset(editor, off);
  }, 300);
  refreshUndoBtns();
}

function bindEditor(el, articleId, idx){
  el.setAttribute('data-aid', articleId);
  el.setAttribute('data-idx', idx);
  el.addEventListener('input', function(){ onEditorInput(el); });
  /* 单句写作：禁止回车换行与富文本快捷键，保持纯文本单行语义 */
  el.addEventListener('keydown', function(e){
    if (e.isComposing) return;
    if (e.key === 'Enter'){ e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && /^[biu]$/i.test(e.key)) e.preventDefault();
  });
  /* 粘贴仅保留纯文本，execCommand 失效时手动插入 */
  el.addEventListener('paste', function(e){
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    text = text.replace(/\r?\n+/g, ' ');
    if (!document.execCommand('insertText', false, text)){
      var sel = window.getSelection();
      if (sel && sel.rangeCount){
        var r = sel.getRangeAt(0);
        r.deleteContents();
        r.insertNode(document.createTextNode(text));
        r.collapse(false);
        sel.removeAllRanges();
        sel.addRange(r);
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
  });
  /* 禁止拖放内容进入编辑器 */
  el.addEventListener('dragover', function(e){ e.preventDefault(); });
  el.addEventListener('drop', function(e){ e.preventDefault(); });
  /* 失焦时合并相邻文本节点，减少碎片化节点对触控笔划掉定位的干扰 */
  el.addEventListener('blur', function(){ el.normalize(); });
}

/* ---------------- 撤回 / 重做（触屏固定工具条） ---------------- */
var lastEditor = null;
/* 撤回/重做按钮可用态：编辑器聚焦时实时查询，失焦后沿用其记住的状态 */
function refreshUndoBtns(){
  var ed = document.activeElement;
  var isEd = !!(ed && ed.classList && ed.classList.contains('en'));
  var st = null;
  if (isEd){
    var u = true, r = true;
    try { u = document.queryCommandEnabled('undo'); } catch(e){}
    try { r = document.queryCommandEnabled('redo'); } catch(e){}
    ed._undoState = { u: u, r: r };
    st = ed._undoState;
  } else if (lastEditor && document.contains(lastEditor) && lastEditor._undoState){
    st = lastEditor._undoState;
  }
  /* 焦点位于标题等其他输入控件时不沿用旧状态，直接置灰，避免误操作到句子编辑器 */
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) st = null;
  $('#undoBtn').disabled = !(st && st.u);
  $('#redoBtn').disabled = !(st && st.r);
}
document.addEventListener('focusin', function(e){
  var t = e.target;
  if (t.classList && t.classList.contains('en')) lastEditor = t;
  refreshUndoBtns();
  /* 触屏：等软键盘弹起后再滚动编辑区到可视中央，避免末句被键盘遮挡 */
  if (!IS_COARSE) return;
  var isEditor = (t.classList && t.classList.contains('en')) || t.id === 'sourceText';
  if (!isEditor) return;
  setTimeout(function(){
    if (document.activeElement !== t || !document.contains(t)) return;
    try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    catch(err){ t.scrollIntoView(); }
  }, 350);
});
function runEditCmd(cmd, label){
  var ed = document.activeElement;
  if (ed && (ed.tagName === 'INPUT' || ed.tagName === 'TEXTAREA')){ toast('当前输入框不支持' + label); return; }
  if (!ed || !ed.classList || !ed.classList.contains('en')) ed = lastEditor;
  if (!ed || !document.contains(ed)){ toast('还没有可' + label + '的编辑'); return; }
  ed.focus();
  try { if (!document.execCommand(cmd)) toast('没有可' + label + '的内容'); } catch(e){}
  refreshUndoBtns();
}
$('#undoBtn').addEventListener('click', function(){ runEditCmd('undo', '撤回'); });
$('#redoBtn').addEventListener('click', function(){ runEditCmd('redo', '重做'); });
/* 点按按钮不转移焦点：保持编辑器聚焦与键盘常驻，避免 blur 归一化干扰撤销栈 */
[$('#undoBtn'), $('#redoBtn')].forEach(function(b){
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); });
});

/* ---------------- 标红 / 取消标红 ---------------- */
function selectionIn(editor){
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  var range = sel.getRangeAt(0);
  var node = range.commonAncestorContainer;
  if (node.nodeType === 3) node = node.parentNode;
  if (!node.closest || !(editor === node || editor.contains(node))) return null;
  return { sel: sel, range: range };
}

/* 判断选区是否严格穿过缺词标记（边界相接不算，紧邻标记的文字仍可正常操作） */
function selectionIntersectsGap(editor, range){
  var gaps = editor.querySelectorAll('.gap');
  for (var i = 0; i < gaps.length; i++){
    var gr = document.createRange();
    gr.selectNodeContents(gaps[i]);
    if (range.compareBoundaryPoints(Range.START_TO_END, gr) < 0 &&
        range.compareBoundaryPoints(Range.END_TO_START, gr) > 0) return true;
  }
  return false;
}

/* 选区边缘裁剪：收缩 Range 首尾的空白字符，边缘空格不参与标红（词间空格保留） */
function trimRangeEdges(range){
  var root = range.commonAncestorContainer;
  var segs = [];
  function segOf(n){
    return { n: n, s: (n === range.startContainer) ? range.startOffset : 0, e: (n === range.endContainer) ? range.endOffset : n.nodeValue.length };
  }
  if (root.nodeType === 3){
    segs.push(segOf(root));
  } else {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    while (walker.nextNode()){
      if (range.intersectsNode(walker.currentNode)) segs.push(segOf(walker.currentNode));
    }
  }
  var first = null, last = null;
  segs.forEach(function(seg){
    var t = seg.n.nodeValue.slice(seg.s, seg.e);
    if (!/\S/.test(t)) return;
    if (!first){
      var lead = t.length - t.replace(/^\s+/, '').length;
      first = { n: seg.n, off: seg.s + lead };
    }
    last = seg;
  });
  if (!first || !last) return false;
  var tail = last.n.nodeValue.slice(last.s, last.e).replace(/\s+$/, '');
  try {
    range.setStart(first.n, first.off);
    range.setEnd(last.n, last.s + tail.length);
  } catch(e){ return false; }
  return true;
}

function markSelection(editor){
  var box = selectionIn(editor);
  if (!box) { toast('请先在本句中选中要标红的文字'); return; }
  if (box.sel.isCollapsed) { toast('请先选中要标红的文字'); return; }
  if (selectionIntersectsGap(editor, box.range)) { toast('无法标红缺词标记'); return; }
  if (!trimRangeEdges(box.range)) { toast('选中内容只有空白，无需标红'); return; }
  if (selectionAllMarked(editor, box.range)) { toast('已标红'); return; }
  try {
    var frag = box.range.extractContents();
    /* 展平选区内已有的标红，避免嵌套或重复标红 */
    unwrapMarks(frag);
    var span = document.createElement('span');
    span.className = 'mark';
    span.appendChild(frag);
    box.range.insertNode(span);
    /* 展平嵌套标红：插入点落在旧标红内部时不产生 mark 套 mark */
    var nested = editor.querySelectorAll('.mark .mark');
    for (var i = nested.length - 1; i >= 0; i--) unwrapNode(nested[i]);
    box.sel.removeAllRanges();
    editor.normalize();
    onEditorInput(editor);
    toast('已标红');
  } catch(e){
    toast('无法标红该选区，请尝试缩小选中范围');
  }
}

/* 判断选区覆盖的全部文本是否已处于标红内（按文本节点逐个核对祖先） */
function selectionAllMarked(editor, range){
  var walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
  var found = false;
  while (walker.nextNode()){
    var n = walker.currentNode;
    if (!n.nodeValue.trim()) continue;
    if (!range.intersectsNode(n)) continue;
    found = true;
    var p = n.parentNode, inMark = false;
    while (p && p !== editor){
      if (p.classList && p.classList.contains('mark')){ inMark = true; break; }
      p = p.parentNode;
    }
    if (!inMark) return false;
  }
  return found;
}

/* 将单个节点的内容提升到其父级 */
function unwrapNode(m){
  var p = m.parentNode;
  while (m.firstChild) p.insertBefore(m.firstChild, m);
  p.removeChild(m);
}

/* 展平容器内的全部标红节点为普通文本 */
function unwrapMarks(root){
  var ms = root.querySelectorAll('.mark');
  for (var i = ms.length - 1; i >= 0; i--) unwrapNode(ms[i]);
}

function unmarkSelection(editor){
  var box = selectionIn(editor);
  if (!box) { toast('请先在本句中操作'); return; }
  if (selectionIntersectsGap(editor, box.range)) { toast('无法标红缺词标记'); return; }
  var marks = [];
  if (box.sel.isCollapsed){
    var node = box.range.startContainer;
    if (node.nodeType === 3) node = node.parentNode;
    var m = node.closest ? node.closest('.mark') : null;
    if (m && editor.contains(m)) marks.push(m);
  } else {
    var all = editor.querySelectorAll('.mark');
    for (var i=0;i<all.length;i++) if (box.sel.containsNode(all[i], true)) marks.push(all[i]);
  }
  if (!marks.length){ toast('选中范围内没有标红文字'); return; }
  marks.forEach(function(m){
    var parent = m.parentNode;
    while (m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
    parent.normalize();
  });
  box.sel.removeAllRanges();
  onEditorInput(editor);
  toast('已取消标红');
}

/* 在光标处插入缺词标记：句内无光标/选区时拒绝插入 */
function insertGapMarker(editor){
  var box = selectionIn(editor);
  if (!box){ toast('请先将光标放入本句缺词位置'); return; }
  editor.focus();
  var range = box.range.cloneRange();
  range.collapse(true);
  try {
    var marker = document.createElement('span');
    marker.className = 'gap';
    marker.setAttribute('contenteditable', 'false');
    marker.setAttribute('title', '缺词标记：此处应有一个词');
    marker.textContent = '|';
    range.insertNode(marker);
    var after = document.createRange();
    after.setStartAfter(marker);
    after.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(after);
    editor.normalize();
    onEditorInput(editor);
    toast('已插入缺词标记');
  } catch(e){
    toast('无法在此处缺词标记');
  }
}

/* ---------------- 复制模块 ---------------- */
function copyText(text, msg){
  if (!text){ toast('本句还没有内容'); return; }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    ta.remove();
    toast(msg);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, fallback);
  } else fallback();
}

/* ---------------- 词典查询与选中操作浮标模块 ---------------- */
var dictChip = $('#dictChip'), dictPanel = $('#dictPanel');
var chipDictBtn = $('#chipDict'), chipMarkBtn = $('#chipMark');
var currentDictWord = '';
var dictAnchor = null;
var chipCtx = null; /* 浮标上下文：{ kind:'zh'|'en', text, editor, range } */
var chipSnapshot = null; /* 触屏点击浮标时系统可能先清空选区，保留最近一次上下文快照 */
var IS_COARSE = !!(window.matchMedia && window.matchMedia('(any-pointer: coarse)').matches);
if (IS_COARSE) document.body.classList.add('touch');

/* 触屏端：按当前选区显隐各句工具栏中的 查词典/标红 按钮（仅选中文字的句子显示） */
function updateTouchToolbars(){
  var sel = window.getSelection();
  var node = (sel && sel.rangeCount && !sel.isCollapsed) ? sel.getRangeAt(0).commonAncestorContainer : null;
  if (node && node.nodeType === 3) node = node.parentNode;
  var card = (node && node.closest) ? node.closest('.sent') : null;
  var inEn = false, inZh = false;
  if (card){
    var zhEl = node.closest('.zh');
    var enEl = node.closest('.en');
    inZh = !!zhEl;
    inEn = !!(enEl && enEl.isContentEditable && !selectionIntersectsGap(enEl, sel.getRangeAt(0)));
  }
  var cards = document.querySelectorAll('#sentenceList .sent');
  for (var i = 0; i < cards.length; i++){
    cards[i].classList.toggle('sel-zh', cards[i] === card && inZh);
    cards[i].classList.toggle('sel-en', cards[i] === card && inEn);
  }
}

/* 由当前选区刷新浮标状态；词典面板打开时不再弹浮标；触屏端不弹浮标（改用句内固定按钮） */
function updateChip(){
  if (IS_COARSE){ updateTouchToolbars(); hideChip(); return; }
  if (dictPanel.style.display === 'flex') return;
  var sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount){ hideChip(); return; }
  var range = sel.getRangeAt(0);
  var node = range.commonAncestorContainer;
  if (node.nodeType === 3) node = node.parentNode;
  if (!node.closest) { hideChip(); return; }
  var zhEl = node.closest('.zh');
  var enEl = node.closest('.en');
  if (enEl && !enEl.isContentEditable) enEl = null; /* 只读查看层不触发浮标 */
  if (!zhEl && !enEl){ hideChip(); return; }
  var text = sel.toString().trim();
  if (!text){ hideChip(); return; }
  var rect = range.getBoundingClientRect();
  if (rect.width === 0 && rect.height === 0){ hideChip(); return; }
  if (zhEl){
    if (text.length > 60){ hideChip(); return; }
    chipCtx = { kind: 'zh', text: text, editor: null, range: null };
    chipSnapshot = chipCtx;
    showChip(rect, { dict: true });
  } else {
    /* 缺词标记不可查词也不可标红：选区碰到它时完全不弹浮标 */
    if (selectionIntersectsGap(enEl, range)){ hideChip(); return; }
    chipCtx = { kind: 'en', text: text, editor: enEl, range: range.cloneRange() };
    trimRangeEdges(chipCtx.range); /* 标红与按钮态判定均忽略边缘空格 */
    chipSnapshot = chipCtx;
    showChip(rect, { dict: text.length <= 60, marked: selectionAllMarked(enEl, chipCtx.range) });
  }
}
/* 选区变化去抖：等系统菜单与选区把手操作稳定后再定位浮标 */
var chipTimer = null;
document.addEventListener('selectionchange', function(){
  clearTimeout(chipTimer);
  chipTimer = setTimeout(updateChip, 160);
});

/* 触屏双击选词：manipulation 在禁用双击缩放的同时压制了系统双击选词，这里手动补齐 */
function expandWordRange(range){
  if (range.expand){
    try { range.expand('word'); } catch(e){}
    if (!range.collapsed) return;
  }
  var sc = range.startContainer;
  if (sc.nodeType !== 3) return;
  var text = sc.nodeValue, i = range.startOffset;
  var re = /[A-Za-z0-9\u4e00-\u9fff'’-]/;
  var L = i; while (L > 0 && re.test(text.charAt(L - 1))) L--;
  var R = i; while (R < text.length && re.test(text.charAt(R))) R++;
  if (R > L){
    try { range.setStart(sc, L); range.setEnd(sc, R); } catch(e){}
  }
}
var lastTapT = 0, lastTapX = 0, lastTapY = 0;
document.addEventListener('pointerup', function(e){
  if (e.pointerType !== 'touch') return; /* 笔迹书写会产生连续 pointerup，仅手指双击参与判定 */
  var now = Date.now();
  var dbl = (now - lastTapT < 350) && Math.abs(e.clientX - lastTapX) < 30 && Math.abs(e.clientY - lastTapY) < 30;
  lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
  if (!dbl) return;
  if (!e.target.closest) return;
  if (e.target.closest('button, a, input, textarea, [contenteditable="false"], #dictChip, #dictPanel, .overlay')) return;
  var box = e.target.closest('.zh, .en');
  if (!box) return;
  if (box.classList.contains('en') && !box.isContentEditable) return;
  if (!document.caretRangeFromPoint) return;
  var range = document.caretRangeFromPoint(e.clientX, e.clientY);
  if (!range) return;
  var n = range.startContainer;
  if (n.nodeType === 3) n = n.parentNode;
  if (!n.closest || n.closest('.gap') || !(box === n || box.contains(n))) return;
  expandWordRange(range);
  if (range.collapsed) return;
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
});

function showChip(rect, opts){
  chipDictBtn.hidden = !opts.dict;
  chipMarkBtn.hidden = (opts.marked === undefined);
  if (!chipMarkBtn.hidden) chipMarkBtn.textContent = opts.marked ? '取消标红' : '标红';
  dictChip.style.display = 'flex';
  var w = dictChip.offsetWidth || 84;
  var h = dictChip.offsetHeight || 34;
  var x = rect.left + rect.width / 2 - w / 2;
  var y = rect.top - 36;
  /* 选区贴近视口底部时改放选区下方 */
  if (y + h > window.innerHeight - 8) y = Math.max(8, rect.bottom + 8);
  dictChip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x)) + 'px';
  dictChip.style.top = y + 'px';
  dictAnchor = { left: rect.left, top: rect.top, bottom: rect.bottom };
}
function hideChip(){ dictChip.style.display = 'none'; chipCtx = null; }

/* 触屏设备点击浮标前，系统可能已清空选区并触发 hideChip，回退到最近快照 */
function chipCtxLive(){
  if (chipCtx) return chipCtx;
  if (chipSnapshot && (!chipSnapshot.editor || document.contains(chipSnapshot.editor))) return chipSnapshot;
  return null;
}

dictChip.addEventListener('mousedown', function(e){ e.preventDefault(); });

/* 浮标动作：查词典 / 标红（或取消标红） */
function chipAction(kind){
  var ctx = chipCtxLive();
  if (!ctx) return;
  if (kind === 'dict'){
    if (ctx.text) openDict(ctx.text);
    return;
  }
  if (ctx.kind !== 'en' || !ctx.editor) return;
  var editor = ctx.editor, range = ctx.range;
  hideChip();
  editor.focus();
  var sel = window.getSelection();
  sel.removeAllRanges();
  try { sel.addRange(range); } catch(e){}
  if (selectionAllMarked(editor, range)) unmarkSelection(editor);
  else markSelection(editor);
}

/* 触屏/触控笔：点击浮标时系统会先清空选区再派发 click，选区与浮标可能均已消失，
   因此在 pointerdown 阶段立即执行动作；鼠标仍走 click 路径（配合 mousedown 防抖保住选区） */
var chipFiredOnDown = false;
function bindChipBtn(btn, kind){
  btn.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'mouse'){ chipFiredOnDown = false; return; }
    chipFiredOnDown = true;
    chipAction(kind);
  });
  btn.addEventListener('click', function(){
    if (chipFiredOnDown){ chipFiredOnDown = false; return; }
    chipAction(kind);
  });
}
bindChipBtn(chipDictBtn, 'dict');
bindChipBtn(chipMarkBtn, 'mark');

function openDict(word){

/* 释义中的英文词条点击：单词自动走 Free Dictionary API 英英查询 */
$('#dictBody').addEventListener('click', function(ev){

function positionPanel(){
  var chipRect = dictAnchor;
  if (!chipRect){
    var b = dictChip.getBoundingClientRect();
    chipRect = { left: b.left, top: b.top, bottom: b.bottom };
  }
  var panelW = dictPanel.offsetWidth || 360;
  var panelH = dictPanel.offsetHeight || 380;
  var x = chipRect.left;
  var y = chipRect.bottom + 8;
  if (x + panelW > window.innerWidth - 10) x = window.innerWidth - panelW - 10;
  if (x < 10) x = 10;
  if (y + panelH > window.innerHeight - 10) y = Math.max(10, chipRect.top - panelH - 8);
  dictPanel.style.left = x + 'px';
  dictPanel.style.top = y + 'px';
}

function fetchWithTimeout(url, ms){
  return new Promise(function(resolve, reject){
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, ms);
    var opts = ctrl ? { signal: ctrl.signal } : {};
    fetch(url, opts).then(function(r){
      clearTimeout(timer);
      if (!r.ok) throw new Error('http ' + r.status);
      resolve(r.json());
    }).catch(function(e){ clearTimeout(timer); reject(e); });
  });
}

function isCJKText(s){ return /[\u4e00-\u9fff]/.test(s); }

/* 单个英文单词判定（含撇号与连字符形式） */
function isSingleEnWord(s){ return /^[A-Za-z][A-Za-z'’-]*$/.test(String(s || '').trim()); }

/* 接口错误转可读文案，如实保留错误码 */
function netErrText(err){
  var m = (err && err.message) || '';
  var http = /^http (\d+)$/.exec(m);
  if (http){
    var code = http[1];
    if (code === '404') return 'HTTP 404（未找到）';
    if (code === '429') return 'HTTP 429（请求过于频繁）';
    return 'HTTP ' + code;
  }
  if (m === 'timeout') return '请求超时';
  if (m === 'empty') return '无有效数据';
  return m ? ('网络错误（' + m + '）') : '网络错误';
}

function lookup(word){
  var cjk = isCJKText(word);
  /* 查询失败时如实展示接口与错误码 */
  function giveUp(err, api){
    if (currentDictWord !== word) return;
    $('#dictBody').innerHTML =
      '<p class="dict-loading" style="line-height:2.2;">未查询到「' + escapeHTML(word) + '」<br>' +
      escapeHTML(api + '：' + netErrText(err)) + '</p>';
    requestAnimationFrame(positionPanel);
  }
  if (cjk){
    /* 中文：机器翻译中译英，结果为单个单词时补显词性 */
    lookupMyMemory(word, true).then(function(res){
      renderDict(res.html, '来源：MyMemory 机器翻译（中译英，仅供参考）');
      var main = String(res.main || '').trim();
      if (isSingleEnWord(main)) fillWordPOS(word, main);
    }, function(err){ giveUp(err, 'MyMemory'); });
  } else if (isSingleEnWord(word)){
    /* 英文单词：Free Dictionary API 英英释义（失败静默重试后再报错） */
    lookupDev(word).then(function(res){
      renderDict(res.html, '来源：Free Dictionary API（英英释义）' + wikiLinkInline(res.sourceUrls));
    }, function(err){ giveUp(err, 'Free Dictionary API'); });
  } else {
    /* 英文句段：机器翻译英译中 */
    lookupMyMemory(word, false).then(function(res){
      renderDict(res.html, '来源：MyMemory 机器翻译（英译中，仅供参考）');
    }, function(err){ giveUp(err, 'MyMemory'); });
  }
}

/* 词性缩写表：此类词不生成查词链接 */
var POS_ABBR_RE = /^(n|v|vt|vi|adj|adv|prep|con|conj|pron|aux|num|art|int|interj|abbr|etc|pl|sb|sth)$/i;
/* 把文本中的英文单词包成可点击词条（data-word 供点击查词），其余原样转义 */
function linkifyEnWords(text){
  var html = '', last = 0, m;
  var re = /[A-Za-z][A-Za-z'’-]*/g;
  while ((m = re.exec(text))){
    var w = m[0];
    if (w.length < 2 || POS_ABBR_RE.test(w)) continue;
    html += escapeHTML(text.slice(last, m.index));
    html += '<span class="dict-w" data-word="' + escapeHTML(w) + '" title="查看英英释义">' + escapeHTML(w) + '</span>';
    last = m.index + w.length;
  }
  html += escapeHTML(text.slice(last));
  return html;
}
/* 按需链接化：中文查询结果链接英文单词，其余整体转义 */
function linkifyWrap(text, linkEn){
  return linkEn ? linkifyEnWords(text) : escapeHTML(text);
}

/* MyMemory 机器翻译接口：中文查英文译法，英文句段查中文释义，附带其他译法供选词参考 */
function lookupMyMemory(word, cjk){
  var pair = cjk ? 'zh-CN|en' : 'en|zh-CN';
  return fetchWithTimeout('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=' + pair, 8000)
    .then(function(d){
      if (currentDictWord !== word) return Promise.reject(new Error('stale'));
      var t = d && d.responseData && d.responseData.translatedText;
      var st = d ? d.responseStatus : 0;
      var ok = st === 200 || st === '200';
      if (!ok || !t || typeof t !== 'string' || /^MYMEMORY WARNING/i.test(t) || /INVALID/i.test(t)) return Promise.reject(new Error('empty'));
      var mainHTML = linkifyWrap(t, cjk);
      /* 中译英结果为单个单词时在左侧词性列预留占位，由 Free Dictionary API 补充 */
      var posCls = (cjk && isSingleEnWord(t)) ? ' dict-posx' : '';
      var html = '<div class="dict-sec"><p class="dict-label">' + (cjk ? '英文译法' : '中文释义') + '</p>' +
             '<div class="dict-li"><span class="dict-pos' + posCls + '"></span><span>' + mainHTML + '</span></div></div>';
      var ms = d && Array.isArray(d.matches) ? d.matches : [];
      var alts = [];
      ms.forEach(function(m){
        var tr = m && m.translation && m.translation.translatedText;
        if (!tr || typeof tr !== 'string') return;
        tr = tr.trim();
        if (!tr || tr === t || /^MYMEMORY WARNING/i.test(tr) || /INVALID/i.test(tr)) return;
        if (alts.indexOf(tr) === -1) alts.push(tr);
      });
      alts = alts.slice(0, 5);
      if (alts.length){
        html += '<div class="dict-sec"><p class="dict-label">其他译法参考</p>';
        alts.forEach(function(x){ html += '<div class="dict-li"><span class="dict-pos"></span><span>' + linkifyWrap(x, cjk) + '</span></div>'; });
        html += '</div>';
      }
      return { html: html, main: t };
    });
}

/* 失败后静默重试的请求封装（4xx 属确定性失败，不重试） */
function fetchWithRetry(url, ms, retries){
  var left = retries;
  function run(){
    return fetchWithTimeout(url, ms).catch(function(e){
      var msg = e && e.message || '';
      if (/^http 4/.test(msg) || left-- <= 0) throw e;
      return new Promise(function(r){ setTimeout(r, 350); }).then(run);
    });
  }
  return run();
}

/* 拉取 Free Dictionary API 词条数据；session 为当前查询词，用于过期判定 */
function fetchDevEntry(word, session, retries){
  return fetchWithRetry('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), 8000, retries)
    .then(function(d){
      if (currentDictWord !== session) return Promise.reject(new Error('stale'));
      if (!Array.isArray(d) || !d.length) return Promise.reject(new Error('empty'));
      var e0 = d[0];
      var phon = (typeof e0.phonetic === 'string') ? e0.phonetic : '';
      if (!phon && Array.isArray(e0.phonetics)){
        e0.phonetics.forEach(function(p){ if (!phon && p && p.text) phon = p.text; });
      }
      return { phon: phon, meanings: e0.meanings || [], sourceUrls: e0.sourceUrls || [] };
    });
}

/* 从 Free Dictionary API 的 sourceUrls 生成内联 Wiktionary 出处链接（圆点分隔） */
function wikiLinkInline(urls){
  if (!Array.isArray(urls) || !urls.length) return '';
  var u = String(urls[0] || '').trim();
  if (!u) return '';
  return ' · <a href="' + escapeHTML(u) + '" target="_blank" rel="noopener">查看词条</a>';
}

/* Free Dictionary API 接口：英文单词英英释义（失败静默重试后再报错） */
function lookupDev(word){
  return fetchDevEntry(word, word, 3).then(function(entry){
    $('#dictPhon').textContent = entry.phon || '';
    var html = '<div class="dict-sec"><p class="dict-label">释义</p>';
    entry.meanings.forEach(function(m){
      (m.definitions || []).slice(0, 3).forEach(function(def){
        html += '<div class="dict-li"><span class="dict-pos">' + escapeHTML(m.partOfSpeech || '') + '</span><span>' +
                escapeHTML(def.definition || '') + '</span></div>';
      });
    });
    html += '</div>';
    return { html: html, sourceUrls: entry.sourceUrls };
  });
}

/* 为中译英单词结果在左列补显词性，并把来源改为双接口标注（查询失败静默忽略） */
function fillWordPOS(session, w){
  fetchDevEntry(w, session, 3).then(function(entry){
    if (currentDictWord !== session) return;
    var ph = $('#dictBody .dict-posx');
    if (!ph) return;
    var pos = [];
    entry.meanings.forEach(function(m){
      if (m && m.partOfSpeech && pos.indexOf(m.partOfSpeech) === -1) pos.push(m.partOfSpeech);
    });
    if (pos.length){
      ph.textContent = pos.slice(0, 3).join(' / ');
      var src = $('#dictBody .dict-src');
      if (src) src.innerHTML = '来源：MyMemory 机器翻译 + Free Dictionary API' + wikiLinkInline(entry.sourceUrls);
    }
  }).catch(function(){});
}

function renderDict(html, src){
  $('#dictBody').innerHTML = html + '<p class="dict-src">' + src + '</p>';
  requestAnimationFrame(positionPanel);
}

$('#dictClose').addEventListener('click', function(){ dictPanel.style.display = 'none'; });

/* ---------------- 档位保存模块（整篇保存 / 保存本句共用菜单） ---------------- */
var saveMenuEl = $('#saveMenu');
var saveTarget = null; /* null 表示整篇保存，数字表示句序号 */

function saveSlot(type, idx){
  var a = cur();
  if (!a || !a.sentences){ toast('请先开始练习'); return; }
  if (typeof idx === 'number'){
    var s = a.sentences[idx];
    if (!s) return;
    if (!plainOf(s.en || '')){ toast('本句还没有内容'); return; }
    s[type] = s.en;
    a.slots[type] = { time: Date.now(), title: a.title };
    toast('本句已存入' + SLOT_LABEL[type]);
  } else {
    var any = false;
    a.sentences.forEach(function(s){
      s[type] = plainOf(s.en || '') ? s.en : null;
      if (s[type]) any = true;
    });
    if (!any){ toast('请先撰写内容'); return; }
    a.slots[type] = { time: Date.now(), title: a.title };
    toast(SLOT_LABEL[type] + '已保存（整篇）');
  }
  persistNow();
  updateMeta();
}

function openSaveMenu(anchor, idx){
  saveTarget = (typeof idx === 'number') ? idx : null;
  saveMenuEl.style.display = 'flex';
  var r = anchor.getBoundingClientRect();
  var mw = saveMenuEl.offsetWidth || 140;
  saveMenuEl.style.left = Math.max(8, Math.min(window.innerWidth - mw - 8, r.left)) + 'px';
  saveMenuEl.style.top = Math.max(8, Math.min(window.innerHeight - saveMenuEl.offsetHeight - 8, r.bottom + 6)) + 'px';
}
function closeSaveMenu(){ saveMenuEl.style.display = 'none'; saveTarget = null; }

$('#saveSlotBtn').addEventListener('click', function(){
  if (saveMenuEl.style.display === 'flex'){ closeSaveMenu(); return; }
  openSaveMenu(this, null);
});
saveMenuEl.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-slot]');
  if (!b) return;
  var t = b.getAttribute('data-slot');
  var idx = saveTarget;
  closeSaveMenu();
  if (SLOT_TYPES.indexOf(t) === -1) return;
  saveSlot(t, idx);
});
document.addEventListener('mousedown', function(e){
  if (saveMenuEl.style.display === 'flex' && !saveMenuEl.contains(e.target) && !e.target.closest('#saveSlotBtn') && !e.target.closest('[data-act="save"]')) closeSaveMenu();

$('#concatBtn').addEventListener('click', function(){

function renderHistory(){
  var a = cur();
  var box = $('#historyList');
  box.innerHTML = '';
  if (!a || !a.sentences){
    box.innerHTML = '<div class="snap-empty">还没有开始练习<br>拆分原文并开始写作后，可保存初稿 / 二稿 / 终稿</div>';

    SLOT_TYPES.forEach(function(t){
      var n = 0;
      a.sentences.forEach(function(s){ if (s[t]) n++; });
      var m = a.sentences.length;

$('#historyList').addEventListener('click', function(ev){

  if (!a || !a.sentences) return;
  var t = btn.getAttribute('data-slot');
  if (SLOT_TYPES.indexOf(t) === -1) return;

function viewSlot(a, t){

  a.sentences.forEach(function(s, i){
    var d = document.createElement('div');
    d.className = 'ro-sent';
    d.innerHTML =
      '<div class="ro-zh"><span class="sent-no" style="display:inline;padding:0 6px 0 0;">' + (i<9?'0':'') + (i+1) + '</span>' + escapeHTML(s.zh) + '</div>' +
      '<div class="ro-en">' + (s[t] ? sanitizeEnHTML(s[t]) : '<span style="color:var(--faint);font-style:italic;">（本句未保存' + SLOT_LABEL[t] + '）</span>') + '</div>';
    body.appendChild(d);
  });
  $('#viewOverlay').classList.add('show');
}

/* ---------------- 弹层通用关闭 ---------------- */
document.querySelectorAll('.overlay').forEach(function(ov){
  ov.addEventListener('click', function(ev){
    if (ev.target === ov || ev.target.closest('[data-close]')){
      ov.classList.remove('show');
      if (ov.id === 'confirmOverlay') confirmCb = null;
    }
  });
});

document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  /* 多层弹窗叠加时只关闭最上层（如历史版本内的查看/确认弹窗） */
  var shown = document.querySelectorAll('.overlay.show');
  if (shown.length){
    var ov = shown[shown.length - 1];
    ov.classList.remove('show');
    if (ov.id === 'confirmOverlay') confirmCb = null;
  } else if (saveMenuEl && saveMenuEl.style.display === 'flex'){
    closeSaveMenu();
  } else if (dictPanel.style.display === 'flex'){
    dictPanel.style.display = 'none';
  } else if (dictChip.style.display === 'flex'){
    hideChip();
  } else if (rail.classList.contains('open')){
    closeRail();
  }
});

/* ---------------- 原文录入事件 ---------------- */
$('#sourceText').addEventListener('input', function(){
  cur().sourceText = this.value;
  persist();
  updateSplitHint();
});
$('#startBtn').addEventListener('click', function(){
  var a = cur();
  var sents = splitSentences($('#sourceText').value);
  if (!sents.length){ toast('请先输入中文原文'); return; }
  a.sourceText = $('#sourceText').value;
  if (a.autoTitle !== false) a.title = titleFromSource(a.sourceText);
  /* 重新拆分时按中文原句匹配保留已写内容与各档存稿（深拷贝，重复句各自独立） */
  var pool = (a.sentences || []).map(function(s){
    return { zh: s.zh, en: s.en, draft: s.draft || null, second: s.second || null, final: s.final || null };
  });
  var used = pool.map(function(){ return false; });
  var next = [];
  var lost = 0;
  sents.forEach(function(zh){
    var idx = -1;
    for (var i=0;i<pool.length;i++){ if (!used[i] && pool[i].zh === zh){ idx = i; break; } }
    if (idx > -1){ used[idx] = true; next.push(pool[idx]); }
    else next.push({ zh: zh, en: '', draft: null, second: null, final: null });
  });
  pool.forEach(function(s, i){ if (!used[i] && plainOf(s.en || '')) lost++; });
  a.sentences = next;
  editingSource = false;
  persistNow();
  renderRail(); renderMain();
  if (lost > 0) toast('已拆分为 ' + a.sentences.length + ' 句，' + lost + ' 句已写译文因原文删改而未保留', 3600);
  else toast('已拆分为 ' + a.sentences.length + ' 句');
});

/* ---------------- 编辑原文 ---------------- */
$('#editSourceBtn').addEventListener('click', function(){
  var a = cur();
  editBackup = a ? (a.sourceText || '') : '';
  editingSource = true;
  renderMain();
  $('#sourceText').focus();
});
/* 取消编辑：还原进入编辑前的原文并返回练习 */
$('#cancelEditBtn').addEventListener('click', function(){
  var a = cur();
  if (a && editBackup !== null && a.sourceText !== editBackup){
    a.sourceText = editBackup;
    persist();
  }
  editingSource = false;
  editBackup = null;
  renderMain();
});

/* ---------------- 标题编辑 ---------------- */
$('#titleInput').addEventListener('input', function(){
  var a = cur();
  if (!a) return;
  a.title = this.value || '未命名文章';
  a.autoTitle = false;
  persist();
  titleShow.textContent = this.value;
  renderRail();
});

/* ---------------- 新建文章 ---------------- */
$('#newArticleBtn').addEventListener('click', function(){
  closeRail();
  persistNow();
  var a = createArticle();
  state.articles.push(a);
  state.currentId = a.id;
  editingSource = false;
  persistNow(); renderRail(); renderMain();
  $('#sourceText').focus();
});

/* ---------------- 导出 / 导入备份 ---------------- */
$('#exportBtn').addEventListener('click', function(){
  var json = JSON.stringify(state, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
  a.href = url;
  a.download = 'juyi-backup-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  /* iOS 等环境可能拦截文件下载：同一手势内同步复制备份文本，可直接粘贴到备忘录等处保存 */
  function copied(){ toast('已导出备份文件，备份内容已复制到剪贴板'); }
  function onlyFile(){ toast('已导出备份文件'); }
  function fallbackCopy(){
    try {
      var ta = document.createElement('textarea');
      ta.value = json;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch(e){ return false; }
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(copied, function(){ fallbackCopy() ? copied() : onlyFile(); });
  } else {
    fallbackCopy() ? copied() : onlyFile();
  }
});

$('#importBtn').addEventListener('click', function(){
  /* 导入方式菜单：优先读取剪贴板，亦可选择文件 */
  importMenuEl.style.display = 'flex';
  var r = this.getBoundingClientRect();
  var mw = importMenuEl.offsetWidth || 140;
  importMenuEl.style.left = Math.max(8, Math.min(window.innerWidth - mw - 8, r.left)) + 'px';
  importMenuEl.style.top = Math.max(8, Math.min(window.innerHeight - importMenuEl.offsetHeight - 8, r.bottom + 6)) + 'px';
});
var importMenuEl = $('#importMenu');
importMenuEl.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-imp]');
  if (!b) return;
  importMenuEl.style.display = 'none';
  if (b.getAttribute('data-imp') === 'file'){ $('#importFile').click(); return; }
  if (navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(txt){
      if (!txt || !txt.trim()){ toast('剪贴板为空，请先复制备份 JSON 或改用选择文件'); return; }
      importFromText(txt);
    }, function(){ toast('无法读取剪贴板（可能未授权），请改用选择文件'); });
  } else {
    toast('此浏览器不支持读取剪贴板，请改用选择文件');
  }
});
document.addEventListener('mousedown', function(e){
  if (importMenuEl.style.display === 'flex' && !importMenuEl.contains(e.target) && !e.target.closest('#importBtn')) importMenuEl.style.display = 'none';
});

function sanitizeEnHTML(html){
  if (typeof html !== 'string') return '';
  var d = document.createElement('div');
  d.innerHTML = html;
  return serializeEditor(d);
}
function sanitizeSentList(arr){
  if (!Array.isArray(arr)) return null;
  var out = [];
  arr.forEach(function(s){
    if (!s || typeof s !== 'object') return;
    var o = { zh: typeof s.zh === 'string' ? s.zh : '', en: sanitizeEnHTML(s.en) };
    SLOT_TYPES.forEach(function(t){
      o[t] = (typeof s[t] === 'string' && plainOf(s[t])) ? sanitizeEnHTML(s[t]) : null;
    });
    out.push(o);
  });
  return out;
}
function sanitizeSlots(sl){
  var out = emptySlots();
  if (sl && typeof sl === 'object'){
    SLOT_TYPES.forEach(function(t){
      var m = sl[t];
      if (m && typeof m === 'object' && typeof m.time === 'number'){
        out[t] = { time: m.time, title: (typeof m.title === 'string' && m.title) ? m.title : '未命名文章' };
      }
    });
  }
  return out;
}
function sanitizeArticle(a){
  if (!a || typeof a !== 'object') return null;
  var sentences = sanitizeSentList(a.sentences);
  if (sentences && sentences.length === 0) sentences = null;
  var art = {
    id: (typeof a.id === 'string' && /^[\w-]{1,64}$/.test(a.id)) ? a.id : uid(),
    title: (typeof a.title === 'string' && a.title.trim()) ? a.title : '未命名文章',
    autoTitle: typeof a.autoTitle === 'boolean' ? a.autoTitle : (a.title === '未命名文章'),
    createdAt: typeof a.createdAt === 'number' ? a.createdAt : Date.now(),
    sourceText: typeof a.sourceText === 'string' ? a.sourceText : '',
    sentences: sentences,
    slots: sanitizeSlots(a.slots)
  };
  /* 兼容旧版备份：把旧快照迁移为档位 */
  if (Array.isArray(a.snapshots) && a.snapshots.length) applyLegacySnapshots(art, a.snapshots);
  return art;
}

/* 备份文本统一解析入口（文件读取与剪贴板粘贴共用） */
function importFromText(raw){
  var data;
  var txt = String(raw || '').replace(/^\uFEFF/, '');
  try { data = JSON.parse(txt); } catch(e){ toast('内容解析失败，请确认是导出的备份 JSON'); return; }
  if (!data || !Array.isArray(data.articles)){ toast('内容格式不正确，缺少文章数据'); return; }
  var incoming = [];
  var seen = {};
  data.articles.forEach(function(a){
    var art = sanitizeArticle(a);
    if (art && !seen[art.id]){ seen[art.id] = true; incoming.push(art); }
  });
  if (!incoming.length){ toast('备份中没有有效的文章数据'); return; }
  var updated = 0;
  incoming.forEach(function(art){
    state.articles.forEach(function(x){ if (x.id === art.id) updated++; });
  });
  var added = incoming.length - updated;
  confirmBox('该备份含 ' + incoming.length + ' 篇文章：新增 ' + added + ' 篇，覆盖 ' + updated + ' 篇（同 ID 文章的现有内容与版本将被替换）。是否导入？', function(){
    incoming.forEach(function(art){
      var exist = -1;
      state.articles.forEach(function(x, i){ if (x.id === art.id) exist = i; });
      if (exist > -1) state.articles[exist] = art;
      else state.articles.push(art);
    });
    if (state.currentId && !cur() && state.articles.length) state.currentId = state.articles[0].id;
    editingSource = false;
    persistNow(); renderRail(); renderMain();
    toast('导入完成：新增 ' + added + ' 篇，覆盖 ' + updated + ' 篇');
  });
}
$('#importFile').addEventListener('change', function(){
  var file = this.files && this.files[0];
  this.value = '';
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){ importFromText(String(reader.result)); };
  reader.readAsText(file, 'utf-8');
});

/* ---------------- 多标签页同步 ---------------- */
window.addEventListener('storage', function(e){
  if (e.key !== LS_KEY) return;
  var active = document.activeElement;
  if (active && ((active.classList && active.classList.contains('en')) || active.id === 'titleInput' || active.id === 'sourceText')) return;
  try {
    var s = JSON.parse(e.newValue);
    if (s && Array.isArray(s.articles)){
      state = s;
      if (!cur() && state.articles.length) state.currentId = state.articles[0].id;
      /* 其他标签写入可能切换了当前文章，丢弃本地编辑态快照避免脏还原 */
      editingSource = false;
      editBackup = null;
      renderRail(); renderMain();
    }
  } catch(err){}
});

/* ---------------- 初始化 ---------------- */
/* WebKit：存在 dblclick 监听时不再对非可点击元素执行双击缩放，保证双击直接选词 */
document.addEventListener('dblclick', function(){});
state.articles.forEach(migrateArticleInPlace);
persistNow();
renderRail();
renderMain();
})();
</script>
